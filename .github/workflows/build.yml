name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show SDK info
      run: xcrun --sdk iphoneos --show-sdk-version

    - name: Build dylib
      run: |
        xcrun -sdk iphoneos clang++ \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -std=c++17 \
          -shared \
          -O2 \
          -fvisibility=hidden \
          main.mm hooks.cpp menu.mm overlay.mm \
          -o ytpavlov_mc_ios.dylib \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework QuartzCore

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: ytpavlov_mc_ios_dylib
        path: ytpavlov_mc_ios.dylib
        retention-days: 30
